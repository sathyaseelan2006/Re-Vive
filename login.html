<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re:Vive - Login</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root">
        <div class="app-container">
            <div class="heritage-header-section">
                <h1 class="heritage-main-title">Re:Vive</h1>
                <p class="heritage-subtitle">An Intelligent Cultural Platform</p>
            </div>
            
            <div class="heritage-form-container">
                <form class="heritage-form" id="loginForm">
                    <input
                        type="email"
                        placeholder="Email"
                        id="email"
                        class="heritage-input"
                        required
                    />
                    <input
                        type="password"
                        placeholder="Password"
                        id="password"
                        class="heritage-input"
                        required
                    />
                    <div id="errorMessage" class="heritage-error"></div>
                    <button type="submit" class="heritage-btn">Login</button>
                </form>
                <div class="heritage-switch">
                    <a href="#" class="heritage-link">Forgot password?</a>
                    <br />
                    <span>New here?</span>
                    <a href="signup.html" class="heritage-link">Sign Up</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase-client.js';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            // Clear previous errors
            errorMessage.textContent = '';
            
            // Validation
            if (!email || !password) {
                errorMessage.textContent = 'Please enter both email and password.';
                return;
            }

            // Disable button during request
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
            
            try {
                const data = await supabase.signIn(email, password);
                const fullName = data.user?.user_metadata?.full_name || data.user?.email || 'User';

                // Check if first login - redirect to preferences
                const isFirst = await supabase.isFirstLogin();
                
                if (isFirst) {
                    alert(`Welcome, ${fullName}! Let's personalize your experience.`);
                    window.location.href = 'preferences.html';
                } else {
                    alert(`Welcome back, ${fullName}!`);
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'Login failed. Please try again.';
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
